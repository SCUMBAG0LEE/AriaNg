name: Fork Release (AriaNg)

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag version to release (e.g., 1.3.15)'
        required: false
        type: string

jobs:
  publish-fork-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Determine target tag and clean version string
      - name: Determine Version
        id: version_info
        run: |
          INPUT_TAG="${{ inputs.target_tag }}"
          GIT_TAG="${{ github.ref_name }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="$GIT_TAG"
          else
            TAG="1.3.15"
          fi
          
          CLEAN_VER=$(echo "$TAG" | sed 's/^v//')
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "CLEAN_VER=$CLEAN_VER" >> $GITHUB_OUTPUT

      # 2. Setup Node.js & Gulp
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install
          npm install -g gulp

      # 3. Build & Package both All-In-One and Standard ZIP files
      - name: Build & Package All-In-One version
        run: |
          mkdir -p release-files
          gulp clean build-bundle
          cd dist
          zip -r -9 "../release-files/AriaNg-${{ steps.version_info.outputs.CLEAN_VER }}-AllInOne.zip" .
          cd ..

      - name: Build & Package Standard version
        run: |
          gulp clean build
          cd dist
          zip -r -9 "../release-files/AriaNg-${{ steps.version_info.outputs.CLEAN_VER }}.zip" .
          cd ..

      # 4. Fetch OP's Release Title & Notes (with local fallback)
      - name: Fetch Upstream Release Info
        id: upstream_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM="mayswind/AriaNg"
          TAG="${{ steps.version_info.outputs.CLEAN_VER }}"
          
          # Query GitHub API for OP's release notes by tag or latest
          RELEASE_JSON=$(gh api "repos/$UPSTREAM/releases/tags/$TAG" 2>/dev/null || gh api "repos/$UPSTREAM/releases/latest" 2>/dev/null || echo "")
          
          TITLE=""
          BODY=""
          if [ -n "$RELEASE_JSON" ]; then
            TITLE=$(echo "$RELEASE_JSON" | jq -r '.name')
            BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
          fi
          
          # Fallback values if API call returns empty or null
          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            TITLE="AriaNg $TAG"
          fi
          
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY="Automated build release for AriaNg version $TAG."
          fi
          
          echo "$BODY" > release-notes.md
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_OUTPUT

      # 5. Publish Full Release on Fork (Published, non-draft)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.upstream_info.outputs.RELEASE_TITLE }}
          tag_name: ${{ steps.version_info.outputs.TAG }}
          body_path: release-notes.md
          files: ./release-files/*.zip
          draft: false
          prerelease: ${{ contains(steps.version_info.outputs.TAG, '-') }}
          make_latest: ${{ !contains(steps.version_info.outputs.TAG, '-') }}
